<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>
    <table border="1">
        <caption>Presidants</caption>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
        </tr>
        <tr>
            <td>Donald</td>
            <td>Trump</td>
        </tr>
        <tr>
            <td>Barack</td>
            <td>Obama</td>
        </tr>
        <tr>
            <td>joe</td>
            <td>bidden</td>
        </tr>
    </table>
</body>
</html>
