<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with parts</title>
</head>
<body>
    <table border="1">
<thead>
    <tr><th>Item</th><th>price</th></tr>
</thead>
    <tbody>
        <tr><td>Notepad</td><td>$100</td></tr>
        <tr><td>pencil</td><td>50$</td></tr>
    </tbody>
    <tfoot>
        <tr><td>Total</td><td>15$</td></tr>
    </tfoot>
  </table>
</body>
</html>
